<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10111a">
<meta name="description" content="NOVA AI — private, on-device AI chat.">
<title>NOVA AI</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{color-scheme:dark;--bg:#10111a;--panel:#171925;--panel2:#202333;--line:#303449;--text:#f4f5fb;--muted:#9da3b8;--accent:#8b7cff;--accent2:#5b9dff;--user:#292c40}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}button,textarea,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{display:grid;grid-template-columns:270px 1fr;height:100dvh}.side{background:#141620;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;padding:4px 8px 15px}.logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900}.new,.sidebtn,.chatitem,.toolbtn{border:1px solid var(--line);background:transparent;border-radius:11px;padding:10px 12px;text-align:left}.new{background:var(--panel2);font-weight:650}.new:hover,.sidebtn:hover,.chatitem:hover{background:#282b3d}.section{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:12px 8px 2px}.chats{overflow:auto;display:flex;flex-direction:column;gap:5px}.chatitem{border:0;color:#dfe2f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatitem.active{background:#292b40;border:1px solid #444866}.sidebottom{margin-top:auto;display:grid;gap:7px}.status{font-size:12px;color:var(--muted);padding:8px}.main{display:flex;flex-direction:column;min-width:0}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px}.topname{font-weight:650}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--muted);font-size:12px}.grow{flex:1}.iconbtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 11px}.content{flex:1;overflow:auto;padding:34px 18px 20px}.thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}.welcome{text-align:center;margin:auto;padding:9vh 12px 4vh}.orb{width:62px;height:62px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:29px;box-shadow:0 12px 55px #7466ff44}.welcome h1{font-size:clamp(27px,5vw,38px);margin:0 0 7px}.welcome p{color:var(--muted);margin:0}.suggestions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:25px}.suggestions button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 13px;color:#d8d9e8}.msg{display:flex;gap:13px;align-items:flex-start}.avatar{width:30px;height:30px;flex:none;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:14px}.msg.user .avatar{background:#343750}.bubble{min-width:0;max-width:100%;padding:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user .bubble{background:var(--user);border:1px solid #3a3e56;border-radius:16px;padding:11px 15px}.msg.assistant .bubble{padding-top:2px}.composer-wrap{padding:12px 18px max(18px,env(safe-area-inset-bottom));}.composer{max-width:820px;margin:auto;border:1px solid #42465d;background:#1a1d2a;border-radius:18px;padding:10px;display:flex;align-items:flex-end;gap:9px;box-shadow:0 12px 40px #0003}.composer textarea{resize:none;max-height:180px;min-height:42px;flex:1;background:transparent;border:0;outline:0;color:var(--text);padding:10px 7px}.send{width:42px;height:42px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:20px;font-weight:800}.send:disabled{opacity:.45;cursor:not-allowed}.hint{text-align:center;color:var(--muted);font-size:11px;padding-top:8px}.progress{height:5px;background:#303449;border-radius:9px;overflow:hidden;margin:12px 0}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}.modalback{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:5}.modalback.open{display:grid}.modal{width:min(540px,100%);max-height:85dvh;overflow:auto;background:#191c29;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 25px 90px #0008}.modal h2{margin:0 0 14px}.modal label{display:block;color:var(--muted);font-size:13px;margin:15px 0 6px}.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#10121c;color:var(--text)}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.primary{background:var(--accent);border:0;border-radius:10px;padding:10px 15px;font-weight:650}.secondary{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 15px}.muted{color:var(--muted);font-size:13px}.modelrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.modelrow small{display:block;color:var(--muted)}.modelrow button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#303449;border:1px solid #555b78;border-radius:12px;padding:10px 15px;display:none;z-index:9}.toast.show{display:block}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:4;inset:0 auto 0 0;width:min(300px,85vw);transform:translateX(-105%);transition:transform .2s;box-shadow:20px 0 60px #0008}.side.open{transform:translateX(0)}.top{padding:0 13px}.content{padding:24px 14px 12px}.composer-wrap{padding-left:12px;padding-right:12px}.top .pill{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="sidebar">
  <div class="brand"><span class="logo">✦</span><span>NOVA AI</span></div>
  <button class="new" id="newChat">＋ &nbsp;New chat</button>
  <div class="section">Your conversations</div>
  <div class="chats" id="chatList"></div>
  <div class="sidebottom">
    
    <button class="sidebtn" id="memoryBtn">✧ &nbsp;Memory</button>
    <button class="sidebtn" id="settingsBtn">⚙ &nbsp;Settings & privacy</button>
    <div class="status" id="deviceStatus">Checking device support…</div>
  </div>
</aside>
<main class="main">
  <header class="top"><button class="iconbtn" id="menuBtn" aria-label="Open menu">☰</button><span class="topname">NOVA</span><span class="pill" id="modelStatus">No model loaded</span><span class="grow"></span></header>
  <section class="content" id="content"><div class="thread" id="thread"></div></section>
  <div class="composer-wrap"><form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="Message NOVA…" aria-label="Message NOVA"></textarea><button class="send" id="send" type="submit" disabled>↑</button></form><div class="hint" id="hint">Your messages stay on this device. AI runs locally in your browser.</div></div>
</main>
</div>
<div class="modalback" id="modalBack"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script type="module">
const $=s=>document.querySelector(s);
const STORE='nova-local-v1';
let data={chats:[],current:null,memories:[],model:null};
let engine=null, generating=false;
function load(){try{data={...data,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{}}
function save(){localStorage.setItem(STORE,JSON.stringify(data));renderList()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function current(){return data.chats.find(c=>c.id===data.current)}
function newChat(){const c={id:uid(),title:'New chat',messages:[],created:Date.now()};data.chats.unshift(c);data.current=c.id;save();renderChat();$('#prompt').focus();$('#sidebar').classList.remove('open')}
function renderList(){const box=$('#chatList');box.innerHTML='';for(const c of data.chats){const b=document.createElement('button');b.className='chatitem'+(c.id===data.current?' active':'');b.textContent=c.title;b.onclick=()=>{data.current=c.id;save();renderChat();$('#sidebar').classList.remove('open')};box.append(b)}}
function addMsg(role,content){const el=document.createElement('div');el.className='msg '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'You':'✦';const b=document.createElement('div');b.className='bubble';b.textContent=content;el.append(av,b);$('#thread').append(el);return b}
function renderChat(){const t=$('#thread');t.innerHTML='';const c=current();if(!c||!c.messages.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="orb">✦</div><h1>What can I help with?</h1><p>Your personal AI. Private by design.</p><div class="suggestions"><button>Explain something simply</button><button>Help me brainstorm ideas</button><button>Write a short plan</button></div>';t.append(w);w.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#prompt').value=b.textContent;$('#prompt').focus();$('#send').disabled=false})}else for(const m of c.messages)addMsg(m.role,m.content);$('#content').scrollTop=$('#content').scrollHeight}
function setProgress(text,pct){$('#hint').textContent=text;$('#progressDummy')?.remove()}
function modal(title,body,buttons=''){ $('#modal').innerHTML='<h2>'+title+'</h2>'+body+'<div class="row">'+buttons+'<button class="secondary" id="closeModal">Close</button></div>';$('#modalBack').classList.add('open');$('#closeModal').onclick=closeModal}
function closeModal(){$('#modalBack').classList.remove('open')}
function webgpuOK(){return !!navigator.gpu}
let webllm=null, modelRecords=[];
async function getLibrary(){if(webllm)return webllm;webllm=await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.89/lib/index.js');modelRecords=webllm.prebuiltAppConfig.model_list;return webllm}
function smallModels(){return modelRecords.filter(m=>/360M|0\.5B|1B|1\.5B|2B/i.test(m.model_id))}
const DEFAULT_MODEL_ID='Qwen2.5-0.5B-Instruct-q4f16_1-MLC';
async function loadModel(id=DEFAULT_MODEL_ID){
 if(engine||generating)return;
 if(!webgpuOK()){
   $('#modelStatus').textContent='Unsupported browser';
   $('#hint').textContent='This browser/device does not support WebGPU. Try a recent version of Chrome or Edge.';
   $('#deviceStatus').textContent='⚠ WebGPU not detected';
   return;
 }
 try{
   $('#modelStatus').textContent='Loading NOVA…';
   $('#hint').textContent='NOVA is preparing its AI for the first time. Keep this tab open; the model downloads automatically.';
   const lib=await getLibrary();
   engine=await lib.CreateMLCEngine(id,{initProgressCallback:p=>{
     const pct=Math.round((p.progress||0)*100);
     $('#modelStatus').textContent='Loading '+pct+'%';
     $('#hint').textContent=p.text||('Downloading NOVA AI model… '+pct+'%');
   }});
   data.model=id;save();
   $('#modelStatus').textContent='NOVA is ready';
   $('#hint').textContent='AI runs on this device. Your chats stay in this browser.';
   $('#deviceStatus').textContent='✓ NOVA AI ready';
 }catch(e){
   engine=null;
   $('#modelStatus').textContent='Could not load AI';
   $('#hint').textContent='NOVA could not start its AI model: '+e.message+' Refresh the page to try again.';
   $('#deviceStatus').textContent='⚠ AI model failed to load';
 }
}
async function send(text){text=text.trim();if(!text||generating)return;if(!engine){toast('NOVA is still loading. Please wait.');return}const c=current()||(()=>{newChat();return current()})();if(!c.messages.length)c.title=text.slice(0,42);c.messages.push({role:'user',content:text});save();renderChat();const answer=addMsg('assistant','');const memoryText=(data.memories||[]).length?'\\nRemembered facts about the user (stored locally):\\n'+data.memories.join('\\n') : '';const history=[{role:'system',content:'You are NOVA, a helpful personal AI. Be clear, accurate, friendly, and age-appropriate. The user values simple explanations.'+memoryText},...c.messages.map(m=>({role:m.role,content:m.content}))];generating=true;$('#send').disabled=true;$('#hint').textContent='NOVA is thinking on your device…';try{const stream=await engine.chat.completions.create({messages:history,stream:true,temperature:0.7,max_tokens:700});let reply='';for await(const part of stream){reply+=part.choices?.[0]?.delta?.content||'';answer.textContent=reply;$('#content').scrollTop=$('#content').scrollHeight}c.messages.push({role:'assistant',content:reply});save()}catch(e){answer.textContent='Something went wrong: '+e.message}finally{generating=false;$('#send').disabled=!engine;$('#hint').textContent='Your messages stay on this device. AI runs locally in your browser.';$('#content').scrollTop=$('#content').scrollHeight}}
function showMemory(){modal('NOVA memory','<p class="muted">These notes are stored only in this browser and included in future chats.</p><textarea id="memText" rows="5" placeholder="Add facts you want NOVA to remember">'+(data.memories||[]).join('\n')+'</textarea>','<button class="primary" id="saveMemory">Save memory</button>');$('#saveMemory').onclick=()=>{data.memories=$('#memText').value.split('\n').map(x=>x.trim()).filter(Boolean);save();closeModal();toast('Memory saved on this device')}}
function showSettings(){modal('Settings & privacy','<p class="muted">NOVA runs its language model in your browser. Chat history, memory and settings are stored in this browser only. They do not automatically sync to your other devices. Clearing browser data may erase them.</p><p class="muted">The website loads its app code and model files from online sources. Once the model and app are cached, chat can work offline. Do not store passwords or sensitive personal information here.</p><button class="secondary" id="exportData">Export my chats (JSON)</button> <button class="secondary" id="clearData">Clear all local chats and memory</button>');$('#exportData').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='nova-chats.json';a.click();URL.revokeObjectURL(a.href)};$('#clearData').onclick=()=>{if(confirm('Delete all chats and memory saved in this browser?')){data.chats=[];data.memories=[];data.current=null;save();closeModal();renderChat()}}}
$('#composer').addEventListener('submit',e=>{e.preventDefault();const v=$('#prompt').value;$('#prompt').value='';$('#prompt').style.height='auto';send(v)});
$('#prompt').addEventListener('input',()=>{$('#prompt').style.height='auto';$('#prompt').style.height=Math.min($('#prompt').scrollHeight,180)+'px';$('#send').disabled=!$('#prompt').value.trim()});
$('#newChat').onclick=newChat;$('#memoryBtn').onclick=showMemory;$('#settingsBtn').onclick=showSettings;$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()};
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
load();if(!data.current||!data.chats.some(c=>c.id===data.current)){if(data.chats[0])data.current=data.chats[0].id}renderList();renderChat();
$('#deviceStatus').textContent=webgpuOK()?'✓ WebGPU available':'⚠ WebGPU not detected';
if(data.model)$('#modelStatus').textContent='Starting NOVA…';
if(!webgpuOK())$('#hint').textContent='WebGPU is required for local AI. Try a recent Chrome or Edge browser on a supported device.';
if(data.memories?.length) { /* local memory is included with each chat */ }
if(webgpuOK()) loadModel();
</script>
</body></html>
